<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Investidor Mestre 3.0 — Google Ads Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#06090f;--sf:#0c1220;--cd:#111a2e;--bd:#1a2744;--g:#00e599;--b:#4d8eff;--p:#a47cff;--y:#ffbe2e;--r:#ff4d6a;--c:#2ee5c9;--t:#e2e8f0;--d:#8899b4;--m:#4a5d80}*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:var(--t);font-family:'DM Sans',system-ui,sans-serif}::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--sf)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}.wrap{max-width:1120px;margin:0 auto;padding:28px 16px}.header{text-align:center;margin-bottom:28px}.badge{display:inline-block;padding:3px 12px;background:rgba(0,229,153,.1);border:1px solid rgba(0,229,153,.2);border-radius:20px;font-size:10px;color:var(--g);font-weight:600;letter-spacing:1px;margin-bottom:10px;text-transform:uppercase}h1{font-size:28px;font-weight:900;letter-spacing:-1px}h1 span{color:var(--g)}.subtitle{color:var(--d);font-size:13px;margin-top:6px}.meta{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px}.meta span{font-size:10px;color:var(--m)}.meta button{padding:4px 12px;background:var(--sf);border:1px solid var(--bd);border-radius:6px;color:var(--d);font-size:10px;cursor:pointer;font-family:inherit}.tabs{display:flex;gap:3px;margin-bottom:28px;justify-content:center;flex-wrap:wrap}.tab{padding:6px 14px;font-size:11px;font-weight:500;color:var(--d);background:var(--sf);border:1px solid var(--bd);border-radius:20px;cursor:pointer;font-family:inherit;transition:.2s}.tab.active{font-weight:700;color:var(--bg);background:var(--g);border-color:var(--g)}.tab:hover:not(.active){background:var(--cd)}.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}.kpi{background:linear-gradient(135deg,var(--cd),var(--sf));border:1px solid var(--bd);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}.kpi .bar{position:absolute;top:0;left:0;right:0;height:3px}.kpi .label{font-size:10px;color:var(--d);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:500}.kpi .value{font-size:26px;font-weight:800;line-height:1}.kpi .sub{font-size:11px;color:var(--m);margin-top:5px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:20px}.sec{margin-bottom:16px;margin-top:32px}.sec h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}.sec p{font-size:12px;color:var(--d);margin:4px 0 0 28px}.box{border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:12px;line-height:1.6;border-left:3px solid}.box.i{background:rgba(0,61,41,.3);border-color:var(--g)}.box.w{background:rgba(61,40,0,.3);border-color:var(--y)}.box.d{background:rgba(61,0,21,.3);border-color:var(--r)}table{width:100%;font-size:11px;border-collapse:collapse}th{text-align:right;padding:7px 6px;color:var(--m);font-size:9px;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid var(--bd)}th:first-child{text-align:left}td{padding:8px 6px;text-align:right;border-bottom:1px solid rgba(26,39,68,.15)}td:first-child{text-align:left;font-weight:600}.status{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:600}.comp{display:grid;gap:10px;margin-bottom:20px}.page{display:none}.page.active{display:block}.footer{text-align:center;margin-top:40px;padding:20px;border-top:1px solid var(--bd)}.footer div{font-size:10px;color:var(--m)}.loading{display:flex;align-items:center;justify-content:center;min-height:80vh;flex-direction:column;gap:16px}.spinner{width:40px;height:40px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{text-align:center;max-width:400px;margin:100px auto;padding:40px}.error button{margin-top:16px;padding:10px 24px;background:var(--g);color:var(--bg);border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;font-family:inherit}canvas{max-height:320px}@media(max-width:768px){.grid2,.comp{grid-template-columns:1fr}.wrap{padding:16px 10px}h1{font-size:22px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spinner"></div><div style="color:var(--g);font-size:16px;font-weight:700">Carregando dados...</div></div></div>
<script>
const SID="10eM89DK8v0IPjUjGlaB_AP88Y9TfvpUZoHZdVBAe2NE";
const csvUrl=s=>"https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(s)+"&t="+Date.now();
function toNum(v){if(typeof v==="number"&&!isNaN(v))return v;if(!v||v===""||v==="-")return 0;let s=String(v).trim().replace("R$","").replace(/\s/g,"");if(s.includes(".")&&s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");const n=parseFloat(s);return isNaN(n)?0:n}
function col(r,names){for(const n of names)for(const k of Object.keys(r)){const kn=k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();const nn=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();if(kn===nn||kn.includes(nn))return r[k]}return null}
function normMes(m){if(!m)return"";return String(m).toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const fK=n=>{n=toNum(n);return"R$"+(n/1000).toFixed(1)+"k"};const fR=n=>{n=toNum(n);return"R$"+Math.round(n).toLocaleString("pt-BR")};
const rc=r=>r>=2.5?"#00e599":r>=1.5?"#4d8eff":r>=1?"#ffbe2e":"#ff4d6a";const lc=l=>l>=0?"#00e599":"#ff4d6a";
const sc=s=>{if(!s)return"#4a5d80";const l=String(s).toLowerCase();return l.includes("venc")?"#00e599":l.includes("prom")?"#4d8eff":l.includes("break")?"#ffbe2e":l.includes("perd")?"#ff4d6a":"#4a5d80"};
const cols=["#00e599","#4d8eff","#a47cff","#ffbe2e","#ff4d6a","#2ee5c9","#ff6bb5","#6366f1","#f97316","#14b8a6"];
Chart.defaults.color="#8899b4";Chart.defaults.borderColor="#1a2744";Chart.defaults.font.family="'DM Sans',system-ui";
let charts={},mensal=[],campanhas=[],vendas=[],currentTab="overview";

async function fetchData(){
try{
const[mR,cR,vR]=await Promise.all([fetch(csvUrl("Looker Mensal")),fetch(csvUrl("Looker Campanhas")),fetch(csvUrl("Looker Vendas"))]);
if(!mR.ok||!cR.ok||!vR.ok)throw new Error("Planilha nao acessivel");
const[mT,cT,vT]=await Promise.all([mR.text(),cR.text(),vR.text()]);
const parse=csv=>Papa.parse(csv,{header:true,skipEmptyLines:true}).data;
mensal=parse(mT).map(r=>({m:String(col(r,["mes","Mes"])||"").trim(),v:toNum(col(r,["vendas"])),inv:toNum(col(r,["investido"])),com:toNum(col(r,["comissao","comissão"])),lu:toNum(col(r,["lucro bruto","lucro"])),roas:toNum(col(r,["roas"])),cpa:toNum(col(r,["cpa"])),ano:String(col(r,["ano"])||"")})).filter(r=>r.v>0&&r.m);
campanhas=parse(cT).map(r=>({mes:String(col(r,["mes","Mes"])||"").trim(),ano:String(col(r,["ano"])||""),c:String(col(r,["campanha"])||"").trim(),tipo:String(col(r,["tipo"])||"").trim(),v:toNum(col(r,["vendas"])),cpa:toNum(col(r,["cpa"])),cu:toNum(col(r,["custo"])),co:toNum(col(r,["comissao","comissão"])),lu:toNum(col(r,["lucro"])),roas:toNum(col(r,["roas"])),st:String(col(r,["status"])||"").trim()})).filter(r=>r.c&&r.mes);
vendas=parse(vT).map(r=>({mes:String(col(r,["mes","Mes"])||"").trim(),ano:String(col(r,["ano"])||""),camp:String(col(r,["campanha"])||"").trim(),tipo:String(col(r,["tipo"])||"").trim(),ad:String(col(r,["ad","criativo","ad/criativo"])||"").trim(),com:toNum(col(r,["comissao","comissão"])),cidade:String(col(r,["cidade"])||"").trim(),estado:String(col(r,["estado"])||"").trim(),regiao:String(col(r,["regiao","região"])||"").trim()})).filter(r=>r.camp&&r.mes);
// Fill missing months from campanhas
const mensalMeses=new Set(mensal.map(r=>normMes(r.m)));
[...new Set(campanhas.map(r=>r.mes))].filter(Boolean).forEach(mes=>{
  if(!mensalMeses.has(normMes(mes))){
    const cp=campanhas.filter(r=>r.mes===mes);const v=cp.reduce((s,r)=>s+r.v,0);const cu=cp.reduce((s,r)=>s+r.cu,0);const co=cp.reduce((s,r)=>s+r.co,0);const lu=cp.reduce((s,r)=>s+r.lu,0);
    if(v>0||cu>0)mensal.push({m:mes,v,inv:cu,com:co,lu,roas:cu>0?co/cu:0,cpa:v>0?cu/v:0,ano:cp[0]?.ano||""});
  }
});
const mo={"janeiro":1,"fevereiro":2,"marco":3,"abril":4,"maio":5,"junho":6,"julho":7,"agosto":8,"setembro":9,"outubro":10,"novembro":11,"dezembro":12};
mensal.sort((a,b)=>{const aP=normMes(a.m).split("/"),bP=normMes(b.m).split("/");return((parseInt(aP[1])||0)*100+(mo[aP[0]]||0))-((parseInt(bP[1])||0)*100+(mo[bP[0]]||0))});
render();
}catch(e){document.getElementById("app").innerHTML='<div class="error"><div style="font-size:32px">⚠️</div><div style="color:#ff4d6a;font-size:16px;font-weight:700;margin:12px 0">Erro ao carregar</div><div style="color:#8899b4;font-size:13px;margin-bottom:16px">'+e.message+'</div><button onclick="location.reload()">Tentar novamente</button></div>'}}

function render(){
const totV=mensal.reduce((s,r)=>s+r.v,0),totI=mensal.reduce((s,r)=>s+r.inv,0),totC=mensal.reduce((s,r)=>s+r.com,0),totL=mensal.reduce((s,r)=>s+r.lu,0),roasG=totI>0?totC/totI:0;
const m26=mensal.filter(r=>r.ano==="2026"||r.m.includes("/2026")||r.m.includes("/26"));
const v26=m26.reduce((s,r)=>s+r.v,0),l26=m26.reduce((s,r)=>s+r.lu,0);
const meses26=[...new Set(campanhas.filter(r=>r.ano==="2026"||r.mes.includes("/2026")||r.mes.includes("/26")).map(r=>r.mes))].filter(Boolean);
let acum=0;const acumArr=mensal.map(r=>{acum+=r.lu;return acum});
const geoMap={};vendas.forEach(r=>{const e=r.estado;if(e&&e!=="NaN"&&e!=="")geoMap[e]=(geoMap[e]||0)+1});
const geoArr=Object.entries(geoMap).map(([e,v])=>({e,v})).sort((a,b)=>b.v-a.v).slice(0,12);
const regMap={};vendas.forEach(r=>{const rg=r.regiao;if(rg&&rg!=="NaN"&&rg!=="")regMap[rg]=(regMap[rg]||0)+1});
const regArr=Object.entries(regMap).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
const tipoMap={};campanhas.forEach(r=>{const t=r.tipo||"Outros";if(!tipoMap[t])tipoMap[t]={v:0,cu:0,co:0,lu:0};tipoMap[t].v+=r.v;tipoMap[t].cu+=r.cu;tipoMap[t].co+=r.co;tipoMap[t].lu+=r.lu});
const tipoArr=Object.entries(tipoMap).map(([t,d])=>({t,...d,roas:d.cu>0?d.co/d.cu:0})).sort((a,b)=>b.v-a.v);
const tabs=[{id:"overview",l:"Visão Geral"},...meses26.map(m=>({id:m,l:m.split("/")[0]})),{id:"tipos",l:"Por Tipo"},{id:"geo",l:"Geo"}];

function kpi(a,b,c,d){d=d||"#00e599";return'<div class="kpi"><div class="bar" style="background:linear-gradient(90deg,'+d+',transparent)"></div><div class="label">'+a+'</div><div class="value" style="color:'+d+'">'+b+'</div>'+(c?'<div class="sub">'+c+'</div>':'')+'</div>'}
function sec(a,b,c){return'<div class="sec"><h2>'+a+' '+b+'</h2>'+(c?'<p>'+c+'</p>':'')+'</div>'}
function box(a,b){return'<div class="box '+a+'">'+b+'</div>'}
function campTable(data,title){
  const tid="ct-"+Math.random().toString(36).slice(2,8);
  const headers=[{l:"Campanha",k:"c",align:"left",str:true},{l:"Tipo",k:"tipo",align:"left",str:true},{l:"Vendas",k:"v"},{l:"Custo",k:"cu"},{l:"Comissão",k:"co"},{l:"Lucro",k:"lu"},{l:"ROAS",k:"roas"},{l:"Status",k:"st",align:"left",str:true}];
  function buildTable(arr,sortKey,sortDir){
    let sorted=[...arr];
    if(sortKey){const h=headers.find(h=>h.k===sortKey);sorted.sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];if(h&&h.str)return sortDir==="asc"?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));return sortDir==="asc"?va-vb:vb-va});}
    let rows="";
    sorted.forEach(r=>{rows+='<tr><td>'+r.c+'</td><td style="font-size:10px;color:#8899b4">'+r.tipo+'</td><td style="font-weight:700">'+r.v+'</td><td style="color:#8899b4">'+fK(r.cu)+'</td><td style="color:#2ee5c9">'+fK(r.co)+'</td><td style="font-weight:700;color:'+lc(r.lu)+'">'+fK(r.lu)+'</td><td style="font-weight:800;color:'+rc(r.roas)+';font-size:12px">'+r.roas.toFixed(2)+'</td><td><span class="status" style="background:'+sc(r.st)+'20;color:'+sc(r.st)+'">'+r.st+'</span></td></tr>';});
    return rows;
  }
  function thStyle(h,sortKey,sortDir){const active=sortKey===h.k;const align=h.align||"right";const arrow=active?(sortDir==="asc"?" ↑":" ↓"):" ↕";return'<th data-key="'+h.k+'" style="text-align:'+align+';cursor:pointer;user-select:none;'+(active?"color:#00e599;":"")+'" title="Ordenar por '+h.l+'">'+h.l+'<span style="opacity:'+(active?1:.3)+';font-size:9px">'+arrow+'</span></th>';}
  let sortKey="v",sortDir="desc";
  const html='<div class="card" id="wrap-'+tid+'">'+(title?'<div style="font-size:13px;font-weight:700;margin-bottom:12px">'+title+'</div>':'')+'<div style="overflow-x:auto"><table id="'+tid+'"><thead><tr id="head-'+tid+'">'+headers.map(h=>thStyle(h,sortKey,sortDir)).join('')+'</tr></thead><tbody id="body-'+tid+'">'+buildTable(data,sortKey,sortDir)+'</tbody></table></div></div>';
  setTimeout(()=>{
    const head=document.getElementById("head-"+tid);
    if(!head)return;
    head.querySelectorAll("th[data-key]").forEach(th=>{th.addEventListener("click",()=>{const k=th.dataset.key;if(sortKey===k)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=k;sortDir=headers.find(h=>h.k===k)?.str?"asc":"desc";}
    document.getElementById("body-"+tid).innerHTML=buildTable(data,sortKey,sortDir);
    head.innerHTML=headers.map(h=>thStyle(h,sortKey,sortDir)).join('');
    head.querySelectorAll("th[data-key]").forEach(t2=>{t2.addEventListener("click",()=>t2.click())});
    // Re-attach after re-render
    setTimeout(()=>{head.querySelectorAll("th[data-key]").forEach(t2=>{t2.onclick=()=>{const k2=t2.dataset.key;if(sortKey===k2)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=k2;sortDir=headers.find(h=>h.k===k2)?.str?"asc":"desc";}document.getElementById("body-"+tid).innerHTML=buildTable(data,sortKey,sortDir);head.innerHTML=headers.map(h=>thStyle(h,sortKey,sortDir)).join('');attachSort();}})},0);
    })});
    function attachSort(){head.querySelectorAll("th[data-key]").forEach(th=>{th.onclick=()=>{const k=th.dataset.key;if(sortKey===k)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=k;sortDir=headers.find(h=>h.k===k)?.str?"asc":"desc";}document.getElementById("body-"+tid).innerHTML=buildTable(data,sortKey,sortDir);head.innerHTML=headers.map(h=>thStyle(h,sortKey,sortDir)).join('');attachSort();}});}
    attachSort();
  },50);
  return html;
}

function getMesData(mes){let md=mensal.find(r=>normMes(r.m)===normMes(mes));if(md&&md.v>0)return md;const cp=campanhas.filter(r=>r.mes===mes);const v=cp.reduce((s,r)=>s+r.v,0),cu=cp.reduce((s,r)=>s+r.cu,0),co=cp.reduce((s,r)=>s+r.co,0),lu=cp.reduce((s,r)=>s+r.lu,0);return{m:mes,v,inv:cu,com:co,lu,roas:cu>0?co/cu:0,cpa:v>0?cu/v:0,ano:cp[0]?.ano||""}}

// Build ad performance per month
function getAdPerf(mes){
  const mv=vendas.filter(r=>normMes(r.mes)===normMes(mes)&&r.ad&&r.ad!==""&&r.ad!=="NaN"&&r.ad!=="-");
  const adMap={};
  mv.forEach(r=>{
    const ad=r.ad;
    if(!adMap[ad])adMap[ad]={ad,vendas:0,comTotal:0,tipo:r.tipo||"",camp:r.camp||""};
    adMap[ad].vendas++;adMap[ad].comTotal+=r.com;
  });
  return Object.values(adMap).sort((a,b)=>b.vendas-a.vendas);
}

function adTable(adData){
  if(!adData.length)return'';
  let h=sec("🎬","Desempenho por Anúncio","Top criativos do mês por vendas");
  h+='<div class="card"><table><thead><tr><th style="text-align:left">Anúncio / Criativo</th><th>Campanha</th><th>Vendas</th><th>Comissão Total</th><th>Ticket Médio</th></tr></thead><tbody>';
  adData.slice(0,15).forEach((r,i)=>{
    const ticket=r.vendas>0?r.comTotal/r.vendas:0;
    h+='<tr><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span style="color:'+cols[i%10]+';margin-right:6px">●</span>'+r.ad+'</td><td style="font-size:10px;color:#8899b4">'+r.tipo+'</td><td style="font-weight:700">'+r.vendas+'</td><td style="color:#8899b4">'+fK(r.comTotal)+'</td><td style="font-weight:600;color:#2ee5c9">'+fR(ticket)+'</td></tr>';
  });
  h+='</tbody></table></div>';
  // Chart
  const top8=adData.slice(0,8);
  if(top8.length>1){
    const cid="ch-ad-"+normMes(adData[0]?.camp||"x").replace(/[^a-z0-9]/g,"")+""+Math.random().toString(36).slice(2,6);
    h+='<div class="card"><canvas id="'+cid+'"></canvas></div>';
    // Queue chart render
    setTimeout(()=>{
      const el=document.getElementById(cid);
      if(el){
        if(charts["ad_"+cid])charts["ad_"+cid].destroy();
        charts["ad_"+cid]=new Chart(el,{type:"bar",data:{labels:top8.map(r=>r.ad.length>30?r.ad.slice(0,30)+"...":r.ad),datasets:[{label:"Vendas",data:top8.map(r=>r.vendas),backgroundColor:top8.map((_,i)=>cols[i%10]+"90"),borderRadius:4}]},options:{responsive:true,indexAxis:"y",plugins:{legend:{display:false}},scales:{x:{grid:{color:"#1a274440"}}}}});
      }
    },100);
  }
  return h;
}

let pages='';

// OVERVIEW
pages+='<div class="page active" id="p-overview"><div class="grid4">'+kpi("Vendas ("+mensal.length+" meses)",totV.toLocaleString("pt-BR"),"Investido: "+fK(totI))+kpi("Lucro Bruto",fK(totL),"Comissão: "+fK(totC),"#4d8eff")+kpi("ROAS Geral",roasG.toFixed(2),"CPA: "+fR(totV>0?totI/totV:0),"#a47cff")+kpi("Vendas 2026",v26.toLocaleString("pt-BR"),"Lucro: "+fK(l26),"#2ee5c9")+'</div>'+sec("📈","Evolução Mensal","Vendas, Lucro e ROAS")+'<div class="card"><canvas id="ch-evo"></canvas></div>'+sec("💰","Lucro Acumulado")+'<div class="card"><canvas id="ch-acum"></canvas></div>'+sec("🏆","Comparativo 2026")+'<div class="comp" style="grid-template-columns:repeat('+m26.length+',1fr)">'+m26.map((d,i)=>'<div style="background:#111a2e;border:1px solid #1a2744;border-radius:14px;padding:16px;text-align:center"><div style="font-size:11px;font-weight:700;color:'+cols[i%10]+';margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">'+d.m.split("/")[0]+'</div><div style="font-size:28px;font-weight:900">'+d.v+'</div><div style="font-size:10px;color:#4a5d80">vendas</div><div style="margin-top:8px;font-size:20px;font-weight:800;color:'+rc(d.roas)+'">'+d.roas.toFixed(2)+'</div><div style="font-size:9px;color:#4a5d80">ROAS</div><div style="margin-top:6px;font-size:10px;color:#8899b4">Lucro: '+fK(d.lu)+'</div></div>').join('')+'</div></div>';

// MESES INDIVIDUAIS
meses26.forEach(mes=>{
  const cp=campanhas.filter(r=>r.mes===mes);
  const md=getMesData(mes);
  const win=cp.filter(r=>r.roas>=2&&r.v>=3);
  const lose=cp.filter(r=>r.roas>0&&r.roas<1&&r.v>0);
  const paused=cp.filter(r=>r.v===0&&r.cu>0);
  const cid="ch-"+mes.replace(/[^a-zA-Z0-9]/g,"");
  const adData=getAdPerf(mes);
  pages+='<div class="page" id="p-'+mes+'"><div class="grid4">'+kpi("Vendas",md.v.toString(),"CPA: "+fR(md.cpa))+kpi("ROAS",md.roas.toFixed(2),"Investido: "+fK(md.inv),"#4d8eff")+kpi("Lucro",fK(md.lu),"Comissão: "+fK(md.com),"#00e599")+kpi("Campanhas",cp.length.toString(),win.length+" venc · "+lose.length+" perd","#a47cff")+'</div>'+campTable(cp,"Campanhas — "+mes)+(win.length?box("i","🧠 <strong>Vencedoras:</strong> "+win.map(w=>w.c+" ("+w.roas.toFixed(2)+")").join(" · ")):"")+(lose.length?box("d","🔴 <strong>Prejuízo:</strong> "+lose.map(l=>l.c+" ("+l.roas.toFixed(2)+", "+fK(l.lu)+")").join(" · ")):"")+(paused.length?box("w","⚠️ <strong>Pausadas:</strong> "+paused.map(p=>p.c+" ("+fK(p.cu)+")").join(" · ")):"")+(cp.filter(r=>r.v>0).length>1?'<div class="card"><canvas id="'+cid+'"></canvas></div>':'')+adTable(adData)+'</div>';
});

// TIPOS
let tt='<div class="card"><table><thead><tr><th style="text-align:left">Tipo</th><th>Vendas</th><th>Custo</th><th>Comissão</th><th>Lucro</th><th>ROAS</th></tr></thead><tbody>';
tipoArr.forEach((r,i)=>{tt+='<tr><td style="color:'+cols[i%10]+';font-weight:700">'+r.t+'</td><td style="font-weight:700">'+r.v+'</td><td style="color:#8899b4">'+fK(r.cu)+'</td><td style="color:#8899b4">'+fK(r.co)+'</td><td style="font-weight:700;color:'+lc(r.lu)+'">'+fK(r.lu)+'</td><td style="font-weight:800;color:'+rc(r.roas)+';font-size:13px">'+r.roas.toFixed(2)+'</td></tr>'});
tt+='</tbody></table></div>';
pages+='<div class="page" id="p-tipos">'+sec("📊","Por Tipo de Campanha","Agregado completo")+'<div class="card"><canvas id="ch-tipos"></canvas></div>'+tt+'</div>';

// GEO
pages+='<div class="page" id="p-geo">'+sec("📍","Vendas por Estado",vendas.length+" vendas rastreadas")+'<div class="grid2"><div class="card"><canvas id="ch-geo"></canvas></div><div class="card"><div style="font-size:12px;font-weight:700;margin-bottom:12px">Por Região</div><canvas id="ch-reg" style="max-height:200px"></canvas></div></div><div class="card">'+geoArr.map((r,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:5px 0"><span style="width:24px;font-size:11px;font-weight:700;color:'+cols[i%10]+'">'+r.e+'</span><div style="flex:1;height:6px;background:#1a2744;border-radius:3px;overflow:hidden"><div style="width:'+(geoArr[0]&&geoArr[0].v>0?(r.v/geoArr[0].v*100):0)+'%;height:100%;background:'+cols[i%10]+';border-radius:3px"></div></div><span style="font-size:11px;font-weight:600;min-width:28px;text-align:right">'+r.v+'</span></div>').join('')+'</div></div>';

// RENDER
document.getElementById("app").innerHTML='<div class="header"><div class="badge">Google Ads Analytics · Live</div><h1>Investidor Mestre <span>3.0</span></h1><p class="subtitle">'+mensal.length+' meses · '+totV+' vendas · '+vendas.length+' rastreadas</p><div class="meta"><span>Atualizado: '+new Date().toLocaleString("pt-BR")+'</span><button onclick="location.reload()">↻ Atualizar</button></div></div><div class="tabs">'+tabs.map(t=>'<button class="tab'+(t.id==="overview"?" active":"")+'" data-id="'+t.id+'">'+t.l+'</button>').join('')+'</div><div id="pages">'+pages+'</div><div class="footer"><div>Dashboard Investidor Mestre 3.0 · Dados da planilha Google Sheets</div></div>';

document.querySelectorAll(".tab").forEach(btn=>{btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));btn.classList.add("active");document.getElementById("p-"+btn.dataset.id).classList.add("active");currentTab=btn.dataset.id;renderCharts()})});

function renderCharts(){Object.values(charts).forEach(c=>{if(c&&c.destroy)c.destroy()});charts={};const id=currentTab;
if(id==="overview"){
  charts.evo=new Chart(document.getElementById("ch-evo"),{type:"bar",data:{labels:mensal.map(r=>r.m),datasets:[{label:"Vendas",data:mensal.map(r=>r.v),backgroundColor:"rgba(77,142,255,.5)",borderRadius:4,order:2,yAxisID:"y"},{label:"Lucro",data:mensal.map(r=>r.lu),type:"line",borderColor:"#00e599",backgroundColor:"rgba(0,229,153,.1)",fill:true,tension:.3,order:1,yAxisID:"y"},{label:"ROAS",data:mensal.map(r=>r.roas),type:"line",borderColor:"#ffbe2e",borderWidth:2.5,pointBackgroundColor:"#ffbe2e",pointRadius:4,fill:false,order:0,yAxisID:"y1"}]},options:{responsive:true,interaction:{mode:"index"},scales:{y:{position:"left",grid:{color:"#1a274440"}},y1:{position:"right",min:0,max:3.5,grid:{display:false}}}}});
  charts.acum=new Chart(document.getElementById("ch-acum"),{type:"line",data:{labels:mensal.map(r=>r.m),datasets:[{label:"Lucro Acumulado",data:acumArr,borderColor:"#2ee5c9",backgroundColor:"rgba(46,229,201,.1)",fill:true,tension:.3,pointRadius:3}]},options:{responsive:true,scales:{y:{grid:{color:"#1a274440"},ticks:{callback:v=>(v/1000).toFixed(0)+"k"}}}}});
}
if(meses26.includes(id)){const cp=campanhas.filter(r=>r.mes===id&&r.v>0).sort((a,b)=>b.v-a.v);if(cp.length>1){const cid="ch-"+id.replace(/[^a-zA-Z0-9]/g,"");const el=document.getElementById(cid);if(el)charts.mes=new Chart(el,{type:"bar",data:{labels:cp.map(r=>r.c),datasets:[{label:"Vendas",data:cp.map(r=>r.v),backgroundColor:"rgba(77,142,255,.6)",borderRadius:4},{label:"Lucro",data:cp.map(r=>r.lu),backgroundColor:cp.map(r=>r.lu>=0?"rgba(0,229,153,.5)":"rgba(255,77,106,.5)"),borderRadius:4}]},options:{responsive:true,indexAxis:"y",scales:{x:{grid:{color:"#1a274440"}}}}})}}
if(id==="tipos"){charts.tipos=new Chart(document.getElementById("ch-tipos"),{type:"bar",data:{labels:tipoArr.map(r=>r.t),datasets:[{label:"Vendas",data:tipoArr.map(r=>r.v),backgroundColor:"rgba(77,142,255,.6)",borderRadius:4},{label:"Lucro",data:tipoArr.map(r=>r.lu),backgroundColor:tipoArr.map(r=>r.lu>=0?"rgba(0,229,153,.5)":"rgba(255,77,106,.5)"),borderRadius:4}]},options:{responsive:true,scales:{y:{grid:{color:"#1a274440"}}}}});}
if(id==="geo"){charts.geo=new Chart(document.getElementById("ch-geo"),{type:"bar",data:{labels:geoArr.map(r=>r.e),datasets:[{label:"Vendas",data:geoArr.map(r=>r.v),backgroundColor:geoArr.map((_,i)=>cols[i%10]+"90"),borderRadius:4}]},options:{responsive:true,indexAxis:"y",scales:{x:{grid:{color:"#1a274440"}}}}});if(regArr.length)charts.reg=new Chart(document.getElementById("ch-reg"),{type:"doughnut",data:{labels:regArr.map(r=>r.n),datasets:[{data:regArr.map(r=>r.v),backgroundColor:regArr.map((_,i)=>cols[i%10]),borderWidth:0}]},options:{responsive:true,plugins:{legend:{position:"bottom",labels:{padding:12,font:{size:10}}}}}});}
}renderCharts()}
fetchData();
</script>
</body>
</html>
