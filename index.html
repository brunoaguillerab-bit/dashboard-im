<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Investidor Mestre 3.0 — Google Ads Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #020617;
  --bg1: #06111f;
  --cd: #081426;
  --card2: #0B1730;
  --border: rgba(0,255,178,0.08);
  --border2: rgba(0,255,178,0.18);
  --g: #00FFB2;
  --g2: #00D68F;
  --b: #3b8bff;
  --p: #a78bfa;
  --y: #fbbf24;
  --r: #f87171;
  --c: #22d3ee;
  --t: #ffffff;
  --d: #A8B3CF;
  --m: #6B7A99;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg0);
  color: var(--t);
  font-family: 'Sora', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}

::-webkit-scrollbar-track {
  background: var(--bg1);
}

::-webkit-scrollbar-thumb {
  background: rgba(0,255,178,0.2);
  border-radius: 4px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse-glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,255,178,0); }
  50% { box-shadow: 0 0 20px 4px rgba(0,255,178,0.15); }
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding: 36px 24px;
  position: relative;
  z-index: 1;
}

::before {
  content: '';
  position: fixed;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  width: 700px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(0,255,178,0.06), transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.header {
  text-align: center;
  margin-bottom: 36px;
  animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,255,178,0.07);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 6px 14px;
  margin-bottom: 16px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: var(--g);
  text-transform: uppercase;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--g);
  animation: pulse-glow 2.5s infinite;
}

h1 {
  font-size: 42px;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 12px;
  background: linear-gradient(135deg, #ffffff 0%, var(--g) 60%, var(--b) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.5px;
}

h1 span {
  background: linear-gradient(135deg, var(--g) 0%, var(--c) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.subtitle {
  color: var(--m);
  font-size: 13px;
  margin-top: 6px;
}

.meta {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.meta span {
  font-size: 10px;
  color: var(--m);
}

.meta button {
  padding: 6px 14px;
  background: rgba(0,255,178,0.08);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--g);
  font-size: 10px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}

.meta button:hover {
  background: rgba(0,255,178,0.15);
  box-shadow: 0 0 12px rgba(0,255,178,0.2);
}

.tabs {
  display: flex;
  gap: 3px;
  margin-bottom: 36px;
  justify-content: center;
  flex-wrap: wrap;
  animation: fadeUp 0.45s .05s cubic-bezier(.22,.68,0,1.2) both;
}

.tab {
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 600;
  color: var(--m);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s ease;
}

.tab:hover:not(.active) {
  color: var(--t);
  border-color: var(--border2);
}

.tab.active {
  font-weight: 700;
  color: var(--bg0);
  background: var(--g);
  border-color: var(--g);
  box-shadow: 0 0 16px rgba(0,255,178,0.3);
}

.grid4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 16px;
  margin-bottom: 36px;
}

.grid2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

.kpi {
  background: linear-gradient(135deg, var(--cd) 0%, #0a1930 100%);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
  cursor: default;
  transition: all .25s ease;
}

.kpi:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
}

.kpi .bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
}

.kpi .label {
  font-size: 11px;
  color: var(--m);
  text-transform: uppercase;
  letter-spacing: 1.4px;
  margin-bottom: 8px;
  font-weight: 600;
}

.kpi .value {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  font-family: 'JetBrains Mono', monospace;
}

.kpi .sub {
  font-size: 12px;
  color: var(--m);
  margin-top: 8px;
}

.card {
  background: var(--cd);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
  transition: all .2s ease;
}

.card:hover {
  border-color: var(--border2);
}

.sec {
  margin-bottom: 16px;
  margin-top: 40px;
}

.sec h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--t);
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sec p {
  font-size: 12px;
  color: var(--m);
  margin: 6px 0 0 28px;
}

.box {
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 12px;
  font-size: 13px;
  line-height: 1.6;
  border-left: 3px solid;
  transition: background .15s;
}

.box.i {
  background: rgba(0,255,178,0.07);
  border-color: var(--g);
  color: var(--t);
}

.box.w {
  background: rgba(251,191,36,0.07);
  border-color: var(--y);
  color: var(--t);
}

.box.d {
  background: rgba(248,113,113,0.07);
  border-color: var(--r);
  color: var(--t);
}

.box:hover {
  background: rgba(255,255,255,0.04);
}

table {
  width: 100%;
  font-size: 12px;
  border-collapse: collapse;
  font-family: 'JetBrains Mono', monospace;
}

th {
  text-align: right;
  padding: 10px 8px;
  color: var(--m);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  border-bottom: 1px solid var(--border);
  background: var(--card2);
  font-family: 'Sora', sans-serif;
}

th:first-child {
  text-align: left;
}

td {
  padding: 10px 8px;
  text-align: right;
  border-bottom: 1px solid rgba(0,255,178,0.04);
  transition: background .1s;
}

td:first-child {
  text-align: left;
  font-weight: 600;
  font-family: 'Sora', sans-serif;
  color: var(--t);
}

tr:hover td {
  background: rgba(0,255,178,0.05);
}

.status {
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 700;
}

.comp {
  display: grid;
  gap: 12px;
  margin-bottom: 24px;
}

.page {
  display: none;
  animation: fadeUp 0.4s cubic-bezier(.22,.68,0,1.2) both;
}

.page.active {
  display: block;
}

.footer {
  text-align: center;
  margin-top: 48px;
  padding: 24px;
  border-top: 1px solid var(--border);
}

.footer div {
  font-size: 11px;
  color: var(--m);
}

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  flex-direction: column;
  gap: 16px;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--g);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

.error {
  text-align: center;
  max-width: 400px;
  margin: 100px auto;
  padding: 40px;
}

.error button {
  margin-top: 16px;
  padding: 10px 24px;
  background: var(--g);
  color: var(--bg0);
  border: none;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: all .2s;
}

.error button:hover {
  box-shadow: 0 0 20px rgba(0,255,178,0.3);
}

canvas {
  max-height: 360px;
}

@media(max-width:768px) {
  .grid2, .comp {
    grid-template-columns: 1fr;
  }
  .wrap {
    padding: 20px 16px;
  }
  h1 {
    font-size: 28px;
  }
  .grid4 {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div style="color:var(--g);font-size:16px;font-weight:700">Carregando dados...</div>
  </div>
</div>

<script>
const SID="10eM89DK8v0IPjUjGlaB_AP88Y9TfvpUZoHZdVBAe2NE";
const csvUrl=s=>"https://docs.google.com/spreadsheets/d/"+SID+"/gviz/tq?tqx=out:csv&sheet="+encodeURIComponent(s)+"&t="+Date.now();
function toNum(v){if(typeof v==="number"&&!isNaN(v))return v;if(!v||v===""||v==="-")return 0;let s=String(v).trim().replace("R$","").replace(/\s/g,"");if(s.includes(".")&&s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");const n=parseFloat(s);return isNaN(n)?0:n}
function col(r,names){for(const n of names)for(const k of Object.keys(r)){const kn=k.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();const nn=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();if(kn===nn||kn.includes(nn))return r[k]}return null}
function normMes(m){if(!m)return"";return String(m).toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const fK=n=>{n=toNum(n);return"R$"+(n/1000).toFixed(1)+"k"};const fR=n=>{n=toNum(n);return"R$"+Math.round(n).toLocaleString("pt-BR")};
const rc=r=>r>=2.5?"#00FFB2":r>=1.5?"#3b8bff":r>=1?"#fbbf24":"#f87171";const lc=l=>l>=0?"#00FFB2":"#f87171";
const sc=s=>{if(!s)return"#6B7A99";const l=String(s).toLowerCase();return l.includes("venc")?"#00FFB2":l.includes("prom")?"#3b8bff":l.includes("break")?"#fbbf24":l.includes("perd")?"#f87171":"#6B7A99"};
const cols=["#00FFB2","#3b8bff","#a78bfa","#fbbf24","#f87171","#22d3ee","#ff6bb5","#6366f1","#f97316","#14b8a6"];
Chart.defaults.color="#A8B3CF";Chart.defaults.borderColor="rgba(0,255,178,0.08)";Chart.defaults.font.family="'Sora',system-ui";
let charts={},mensal=[],campanhas=[],vendas=[],currentTab="overview";

async function fetchData(){
try{
const[mR,cR,vR]=await Promise.all([fetch(csvUrl("Looker Mensal")),fetch(csvUrl("Looker Campanhas")),fetch(csvUrl("Looker Vendas"))]);
if(!mR.ok||!cR.ok||!vR.ok)throw new Error("Planilha nao acessivel");
const[mT,cT,vT]=await Promise.all([mR.text(),cR.text(),vR.text()]);
const parse=csv=>Papa.parse(csv,{header:true,skipEmptyLines:true}).data;
mensal=parse(mT).map(r=>({m:String(col(r,["mes","Mes"])||"").trim(),v:toNum(col(r,["vendas"])),inv:toNum(col(r,["investido"])),com:toNum(col(r,["comissao","comissão"])),lu:toNum(col(r,["lucro bruto","lucro"])),roas:toNum(col(r,["roas"])),cpa:toNum(col(r,["cpa"])),ano:String(col(r,["ano"])||"")})).filter(r=>r.v>0&&r.m);
campanhas=parse(cT).map(r=>({mes:String(col(r,["mes","Mes"])||"").trim(),ano:String(col(r,["ano"])||""),c:String(col(r,["campanha"])||"").trim(),tipo:String(col(r,["tipo"])||"").trim(),v:toNum(col(r,["vendas"])),cpa:toNum(col(r,["cpa"])),cu:toNum(col(r,["custo"])),co:toNum(col(r,["comissao","comissão"])),lu:toNum(col(r,["lucro"])),roas:toNum(col(r,["roas"])),st:String(col(r,["status"])||"").trim()})).filter(r=>r.c&&r.mes);
vendas=parse(vT).map(r=>({mes:String(col(r,["mes","Mes"])||"").trim(),ano:String(col(r,["ano"])||""),camp:String(col(r,["campanha"])||"").trim(),tipo:String(col(r,["tipo"])||"").trim(),ad:String(col(r,["ad","criativo","ad/criativo"])||"").trim(),com:toNum(col(r,["comissao","comissão"])),cidade:String(col(r,["cidade"])||"").trim(),estado:String(col(r,["estado"])||"").trim(),regiao:String(col(r,["regiao","região"])||"").trim()})).filter(r=>r.camp&&r.mes);
const mensalMeses=new Set(mensal.map(r=>normMes(r.m)));
[...new Set(campanhas.map(r=>r.mes))].filter(Boolean).forEach(mes=>{
  if(!mensalMeses.has(normMes(mes))){
    const cp=campanhas.filter(r=>r.mes===mes);const v=cp.reduce((s,r)=>s+r.v,0);const cu=cp.reduce((s,r)=>s+r.cu,0);const co=cp.reduce((s,r)=>s+r.co,0);const lu=cp.reduce((s,r)=>s+r.lu,0);
    if(v>0||cu>0)mensal.push({m:mes,v,inv:cu,com:co,lu,roas:cu>0?co/cu:0,cpa:v>0?cu/v:0,ano:cp[0]?.ano||""});
  }
});
const mo={"janeiro":1,"fevereiro":2,"marco":3,"abril":4,"maio":5,"junho":6,"julho":7,"agosto":8,"setembro":9,"outubro":10,"novembro":11,"dezembro":12};
mensal.sort((a,b)=>{const aP=normMes(a.m).split("/"),bP=normMes(b.m).split("/");return((parseInt(aP[1])||0)*100+(mo[aP[0]]||0))-((parseInt(bP[1])||0)*100+(mo[bP[0]]||0))});
render();
}catch(e){document.getElementById("app").innerHTML='<div class="error"><div style="font-size:32px">⚠️</div><div style="color:#f87171;font-size:16px;font-weight:700;margin:12px 0">Erro ao carregar</div><div style="color:#A8B3CF;font-size:13px;margin-bottom:16px">'+e.message+'</div><button onclick="location.reload()">Tentar novamente</button></div>'}}

function render(){
const totV=mensal.reduce((s,r)=>s+r.v,0),totI=mensal.reduce((s,r)=>s+r.inv,0),totC=mensal.reduce((s,r)=>s+r.com,0),totL=mensal.reduce((s,r)=>s+r.lu,0),roasG=totI>0?totC/totI:0;
const m26=mensal.filter(r=>r.ano==="2026"||r.m.includes("/2026")||r.m.includes("/26"));
const v26=m26.reduce((s,r)=>s+r.v,0),l26=m26.reduce((s,r)=>s+r.lu,0);
const meses26=[...new Set(campanhas.filter(r=>(r.ano==="2026"||r.mes.toLowerCase().includes("/2026")||r.mes.toLowerCase().includes("/26"))&&r.mes&&r.mes!=="").map(r=>String(r.mes).trim()))].filter(Boolean).sort((a,b)=>{
  const aP=normMes(a).split("/"),bP=normMes(b).split("/");
  const aY=parseInt(aP[1])||0,bY=parseInt(bP[1])||0;
  const aMo=mo[aP[0]]||0,bMo=mo[bP[0]]||0;
  return(aY*100+aMo)-(bY*100+bMo);
});
let acum=0;const acumArr=mensal.map(r=>{acum+=r.lu;return acum});
const geoMap={};vendas.forEach(r=>{const e=r.estado;if(e&&e!=="NaN"&&e!=="")geoMap[e]=(geoMap[e]||0)+1});
const geoArr=Object.entries(geoMap).map(([e,v])=>({e,v})).sort((a,b)=>b.v-a.v).slice(0,12);
const regMap={};vendas.forEach(r=>{const rg=r.regiao;if(rg&&rg!=="NaN"&&rg!=="")regMap[rg]=(regMap[rg]||0)+1});
const regArr=Object.entries(regMap).map(([n,v])=>({n,v})).sort((a,b)=>b.v-a.v);
const tipoMap={};campanhas.forEach(r=>{const t=r.tipo||"Outros";if(!tipoMap[t])tipoMap[t]={v:0,cu:0,co:0,lu:0};tipoMap[t].v+=r.v;tipoMap[t].cu+=r.cu;tipoMap[t].co+=r.co;tipoMap[t].lu+=r.lu});
const tipoArr=Object.entries(tipoMap).map(([t,d])=>({t,...d,roas:d.cu>0?d.co/d.cu:0})).sort((a,b)=>b.v-a.v);
const tabs=[{id:"overview",l:"Visão Geral"},...meses26.map(m=>({id:m,l:m.split("/")[0]})),{id:"tipos",l:"Por Tipo"},{id:"geo",l:"Geo"}];

function kpi(a,b,c,d){d=d||"#00FFB2";return'<div class="kpi"><div class="bar" style="background:linear-gradient(90deg,'+d+',transparent)"></div><div class="label">'+a+'</div><div class="value" style="color:'+d+'">'+b+'</div>'+(c?'<div class="sub">'+c+'</div>':'')+'</div>'}
function sec(a,b,c){return'<div class="sec"><h2>'+a+' '+b+'</h2>'+(c?'<p>'+c+'</p>':'')+'</div>'}
function box(a,b){return'<div class="box '+a+'">'+b+'</div>'}
function campTable(data,title){
  const tid="ct-"+Math.random().toString(36).slice(2,8);
  const headers=[{l:"Campanha",k:"c",align:"left",str:true},{l:"Tipo",k:"tipo",align:"left",str:true},{l:"Vendas",k:"v"},{l:"Custo",k:"cu"},{l:"Comissão",k:"co"},{l:"Lucro",k:"lu"},{l:"ROAS",k:"roas"},{l:"Status",k:"st",align:"left",str:true}];
  function buildTable(arr,sortKey,sortDir){
    let sorted=[...arr];
    if(sortKey){const h=headers.find(h=>h.k===sortKey);sorted.sort((a,b)=>{const va=a[sortKey],vb=b[sortKey];if(h&&h.str)return sortDir==="asc"?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va));return sortDir==="asc"?va-vb:vb-va});}
    let rows="";
    sorted.forEach(r=>{rows+='<tr><td>'+r.c+'</td><td style="font-size:10px;color:#A8B3CF">'+r.tipo+'</td><td style="font-weight:700">'+r.v+'</td><td style="color:#A8B3CF">'+fK(r.cu)+'</td><td style="color:#22d3ee">'+fK(r.co)+'</td><td style="font-weight:700;color:'+lc(r.lu)+'">'+fK(r.lu)+'</td><td style="font-weight:800;color:'+rc(r.roas)+';font-size:12px">'+r.roas.toFixed(2)+'</td><td><span class="status" style="background:'+sc(r.st)+'20;color:'+sc(r.st)+'">'+r.st+'</span></td></tr>';});
    return rows;
  }
  function thStyle(h,sortKey,sortDir){const active=sortKey===h.k;const align=h.align||"right";const arrow=active?(sortDir==="asc"?" ↑":" ↓"):" ↕";return'<th data-key="'+h.k+'" style="text-align:'+align+';cursor:pointer;user-select:none;'+(active?"color:#00FFB2;":"")+'" title="Ordenar por '+h.l+'">'+h.l+'<span style="opacity:'+(active?1:.3)+';font-size:9px">'+arrow+'</span></th>';}
  let sortKey="v",sortDir="desc";
  const html='<div class="card" id="wrap-'+tid+'">'+(title?'<div style="font-size:13px;font-weight:700;margin-bottom:12px">'+title+'</div>':'')+'<div style="overflow-x:auto"><table id="'+tid+'"><thead><tr id="head-'+tid+'">'+headers.map(h=>thStyle(h,sortKey,sortDir)).join('')+'</tr></thead><tbody id="body-'+tid+'">'+buildTable(data,sortKey,sortDir)+'</tbody></table></div></div>';
  setTimeout(()=>{
    const head=document.getElementById("head-"+tid);
    if(!head)return;
    head.querySelectorAll("th[data-key]").forEach(th=>{th.addEventListener("click",()=>{const k=th.dataset.key;if(sortKey===k)sortDir=sortDir==="desc"?"asc":"desc";else{sortKey=k;sortDir=headers.find(h=>h.k===k)?.str?"asc":"desc";}
    document.getElementById("body-"+tid).innerHTML=buildTable(data,sortKey,sortDir);

function getAdPerf(mes){
  const mv=vendas.filter(r=>normMes(r.mes)===normMes(mes)&&r.ad&&r.ad!==""&&r.ad!=="NaN"&&r.ad!=="-");
  const adMap={};
  mv.forEach(r=>{
    const ad=r.ad;
    if(!adMap[ad])adMap[ad]={ad,vendas:0,comTotal:0,tipo:r.tipo||"",camp:r.camp||""};

}
